# GCP Cloud Build Pipeline: Tier 1-5 Headless WPILib + CTRE Phoenix 6 C++ Simulation & GitHub Precision Gate
#
# Run manually from terminal (uses gs://infra-2008 for staging & artifacts):
#   gcloud builds submit . \
#     --project=infra-2008 \
#     --gcs-source-staging-dir=gs://infra-2008/_cloudbuild/source \
#     --config=cloudbuild.yaml

steps:
  # Step 1: Restore cached Gradle/WPILib/CTRE Maven & JNI cache from gs://infra-2008/frc-10413/gradle-cache/
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    id: "restore-gradle-cache"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        mkdir -p /workspace/.gradle-cache /workspace/libs /workspace/tools
        PYTHON_BIN="$$(command -v python3 || gcloud info --format='value(basic.python_location)')"
        "$${PYTHON_BIN}" ./scripts/generate_class_map.py
        if gcloud storage ls gs://infra-2008/frc-10413/libs/fluxfig-latest.jar >/dev/null 2>&1; then
          echo "Pulling latest FluxFig library from gs://infra-2008/frc-10413/libs/fluxfig-latest.jar..."
          gcloud storage cp gs://infra-2008/frc-10413/libs/fluxfig-latest.jar /workspace/libs/fluxfig-1.0.0.jar
        fi
        if gcloud storage ls gs://infra-2008/frc-10413/tools/flux-processor-latest.jar >/dev/null 2>&1; then
          echo "Pulling standalone FluxProcessor utility from gs://infra-2008/frc-10413/tools/flux-processor-latest.jar..."
          gcloud storage cp gs://infra-2008/frc-10413/tools/flux-processor-latest.jar /workspace/tools/flux-processor.jar
        fi
        if gcloud storage ls gs://infra-2008/frc-10413/gradle-cache/gradle-cache.tar.gz >/dev/null 2>&1; then
          echo "Restoring cached WPILib & CTRE Phoenix 6 JNI libraries from GCS..."
          gcloud storage cp gs://infra-2008/frc-10413/gradle-cache/gradle-cache.tar.gz /workspace/gradle-cache-restored.tar.gz
          tar -xzf /workspace/gradle-cache-restored.tar.gz -C /workspace/.gradle-cache
          rm -f /workspace/gradle-cache-restored.tar.gz
          touch /workspace/.gradle-cache-restored
        else
          echo "No existing Gradle cache in GCS; will populate on this run."
        fi

  # Step 2: Run Tier 1 (Hygiene, Student Docs & BackTo2026), Tier 2 (Solvers), Tier 3 (CTRE TalonFXSimState C++ Sim), Full renderAuto Pipeline & Build .fluxpkg.zip
  - name: "eclipse-temurin:17-jdk-jammy"
    id: "run-tier1-2-3-and-package"
    env:
      - "GRADLE_USER_HOME=/workspace/.gradle-cache"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail
        if ! command -v ffmpeg >/dev/null 2>&1; then
          apt-get update -qq && apt-get install -y -qq --no-install-recommends ffmpeg >/dev/null 2>&1 || true
        fi
        chmod +x ./gradlew
        mkdir -p build
        set +e
        ./gradlew updateStudentDocs spotlessCheck backTo2026 test renderAuto buildFluxPkg -Pchannel=STABLE --no-daemon
        GRADLE_RC=$$?
        set -e
        echo "$${GRADLE_RC}" > build/gradle-exit-code.txt
        if [ "$${GRADLE_RC}" -eq 0 ] && [ ! -f /workspace/.gradle-cache-restored ]; then
          tar --warning=no-file-changed -czf /workspace/gradle-cache.tar.gz -C /workspace/.gradle-cache . || true
        fi

  # Step 3: Post Precision Scorecard to Terminal/GitHub (including red builds), Save Gradle Cache & Publish Passing Artifacts to gs://infra-2008/frc-10413/
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    id: "publish-precision-and-packages-to-gcs"
    env:
      - "COMMIT_SHA=${COMMIT_SHA}"
      - "BRANCH_NAME=${BRANCH_NAME}"
      - "GH_REPO=${_GH_REPO}"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail
        if [ -z "$${GITHUB_TOKEN:-}" ] && gcloud secrets versions access latest --secret=github-status-pat >/dev/null 2>&1; then
          export GITHUB_TOKEN="$$(gcloud secrets versions access latest --secret=github-status-pat)"
        fi
        PYTHON_BIN="$$(command -v python3 || gcloud info --format='value(basic.python_location)')"
        set +e
        "$${PYTHON_BIN}" scripts/post_precision_status.py
        STATUS_RC=$$?
        set -e
        GRADLE_RC="$$(cat build/gradle-exit-code.txt 2>/dev/null || echo 1)"
        if [ "$${GRADLE_RC}" -ne 0 ] || [ "$${STATUS_RC}" -ne 0 ]; then
          echo "ERROR: Verification failed (gradle_rc=$${GRADLE_RC}, status_rc=$${STATUS_RC}); skipping GCS publish." >&2
          exit "$${GRADLE_RC:-1}"
        fi
        source build/git-resolved.env
        if [ -f /workspace/gradle-cache.tar.gz ] && ! gcloud storage ls gs://infra-2008/frc-10413/gradle-cache/gradle-cache.tar.gz >/dev/null 2>&1; then
          echo "Saving WPILib & CTRE JNI Gradle cache to gs://infra-2008/frc-10413/gradle-cache/..."
          gcloud storage cp /workspace/gradle-cache.tar.gz gs://infra-2008/frc-10413/gradle-cache/gradle-cache.tar.gz
        fi
        PKG_ZIP="$$(find build/packages -maxdepth 1 -name '*_systemcore-2027_fluxpkg.zip' | head -n 1)"
        PKG_ALIAS="$$(find build/packages -maxdepth 1 -name '*_v2027.1.0_fluxpkg.zip' | head -n 1)"
        for DEST in "gs://infra-2008/frc-10413/builds/$${SHORT_SHA}" "gs://infra-2008/frc-10413/builds/latest"; do
          gcloud storage cp build/precision-scorecard.json "$${DEST}/precision-scorecard.json"
          gcloud storage cp build/precision-scorecard.txt "$${DEST}/precision-scorecard.txt"
          gcloud storage cp build/precision-scorecard.html "$${DEST}/precision-scorecard.html"
          if [ -n "$${PKG_ZIP}" ] && [ -f "$${PKG_ZIP}" ]; then
            gcloud storage cp "$${PKG_ZIP}" "$${DEST}/$$(basename "$${PKG_ZIP}")"
          fi
          if [ -n "$${PKG_ALIAS}" ] && [ -f "$${PKG_ALIAS}" ]; then
            gcloud storage cp "$${PKG_ALIAS}" "$${DEST}/$$(basename "$${PKG_ALIAS}")"
          fi
          gcloud storage cp STUDENTS.md "$${DEST}/STUDENTS.md"
          gcloud storage cp STUDENT-CHANGELOG.md "$${DEST}/STUDENT-CHANGELOG.md"
          gcloud storage cp docs/class-map.html "$${DEST}/class-map.html"
          gcloud storage cp docs/class-map.svg "$${DEST}/class-map.svg"
          if [ -f build/auto-sim/student-auto.html ]; then
            gcloud storage cp build/auto-sim/student-auto.html "$${DEST}/student-auto.html"
            gcloud storage cp build/auto-sim/student-auto-frames.json "$${DEST}/student-auto-frames.json"
          fi
          if [ -f build/auto-sim/student-auto.mp4 ]; then
            gcloud storage cp build/auto-sim/student-auto.mp4 "$${DEST}/student-auto.mp4"
          fi
        done
        gcloud storage rsync --recursive build/badges "gs://infra-2008/frc-10413/badges/$${BRANCH}"
        echo "================================================================================"
        echo " Published Precision Scorecard & Packages to:"
        echo "   gs://infra-2008/frc-10413/builds/$${SHORT_SHA}/precision-scorecard.html"
        echo "   gs://infra-2008/frc-10413/builds/$${SHORT_SHA}/STABLE_v2027.1.0_systemcore-2027_fluxpkg.zip"
        echo "================================================================================"

substitutions:
  _GH_REPO: "FRC-Flux-Robotics/Flux-SystemCore-2027"

logsBucket: "gs://infra-2008/_cloudbuild/logs"

options:
  machineType: "E2_HIGHCPU_8"
